name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obs-ui/package-lock.json
      - run: npm ci
        working-directory: obs-ui
      - run: npm run build
        working-directory: obs-ui

  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -v ./...
        working-directory: backend

  astrobackend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: astrobackend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: astrobackend
      - run: python3 fetch_data.py
        working-directory: astrobackend
      - run: PYTHONPATH=. pytest
        working-directory: astrobackend
